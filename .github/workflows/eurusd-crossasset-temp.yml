name: Temporary EURUSD cross-asset research
on:
  push:
    branches:
      - agent/cot-eurusd-backtest-20260813
permissions:
  contents: read
jobs:
  crossasset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests scikit-learn
      - run: python tools/eurusd_crossasset_intraday_runfixed_temp.py
