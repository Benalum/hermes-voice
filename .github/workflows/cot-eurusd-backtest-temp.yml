name: Temporary EUR COT backtest
on:
  push:
    branches:
      - agent/cot-eurusd-backtest-20260813
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests
      - run: python tools/cot_eurusd_backtest_temp.py
